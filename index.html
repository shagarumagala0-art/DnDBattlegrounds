<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DnD Chat Companion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <h1>DnD Chat Companion</h1>
      <p>A fresh-start AI chat bot for campaign help.</p>
    </header>

    <section id="chat-log" class="chat-log" aria-live="polite"></section>

    <form id="chat-form" class="chat-form">
      <label class="sr-only" for="chat-input">Message</label>
      <input
        id="chat-input"
        name="message"
        type="text"
        autocomplete="off"
        placeholder="Ask about encounters, rulings, loot, or roleplay..."
        required
      >
      <button type="submit">Send</button>
    </form>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
